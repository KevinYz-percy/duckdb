syntax = "proto3";

package duckdb_grpc;

service DatabaseService {
  rpc ExecuteQuery (QueryRequest) returns (QueryResponse) {}
}

message QueryRequest {
  string sql = 1;
}

message QueryResponse {
  bool success = 1;
  string error_message = 2;
  repeated Row rows = 3;
}

message Row {
  repeated string values = 1;
}
